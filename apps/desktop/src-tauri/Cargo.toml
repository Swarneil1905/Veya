[package]
name = "veya-desktop"
version = "0.1.0"
description = "Veya local task workspace"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2.17"
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
rfd = "=0.17.2"

[features]
custom-protocol = ["tauri/custom-protocol"]
