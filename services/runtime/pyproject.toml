[project]
name = "veya-runtime"
version = "0.1.0"
description = "Veya task runtime and durable local state"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.32,<1",
    "pypdf>=6.21.2,<7",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "httpx==0.28.1",
    "opentelemetry-sdk>=1.38,<2",
    "prometheus-client>=0.22,<1",
    "cryptography>=46,<51",
    "wasmtime==50.0.1",
]

[project.optional-dependencies]
ocr = [
    "pypdfium2>=5.0,<6",
    "rapidocr-onnxruntime==1.4.4",
]
training = [
    "jinja2>=3.1.6,<4",
    "transformers>=5.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9",
    "ruff==0.17.2",
    "mypy==2.4.0",
    "types-openpyxl>=3.1.5.20261017",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veya"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "veya/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["loopback: explicit local-process integration; external network remains denied"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"] # Test helpers shared between scenario modules.

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
files = ["veya"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
