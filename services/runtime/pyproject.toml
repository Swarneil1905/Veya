[project]
name = "veya-runtime"
version = "0.1.0"
description = "Veya task runtime and durable local state"
requires-python = ">=3.10,<3.14"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn>=0.32,<1"]

[dependency-groups]
dev = ["pytest>=8.2,<9", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["veya"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "veya/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
