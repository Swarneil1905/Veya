version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*']
        update-types: [minor, patch]
      development-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: /services/platform
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: uv
    directories:
      - /services/runtime
      - /services/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
