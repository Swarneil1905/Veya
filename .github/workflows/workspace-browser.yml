name: Rendered workspace contracts
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Workspace interactions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install browser on Linux
        if: runner.os == 'Linux'
        run: pnpm exec playwright-core install --with-deps chromium
      - name: IPC interaction regressions
        run: pnpm test:workspace
      - name: Rendered keyboard and accessibility checks
        run: pnpm test:workspace:browser
      - name: Retain screenshots and diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-rendered-${{ matrix.os }}
          path: artifacts/workspace-design/
          if-no-files-found: warn
          retention-days: 14
