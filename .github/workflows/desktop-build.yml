name: Build Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  package:
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.96.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          cache: false
      - run: python scripts/build_platform.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri build --bundles nsis
      - run: node scripts/release-manifest.mjs --native
      - name: Record unsigned native provenance and dependency inventory
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath apps/desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | ForEach-Object { $_.FullName })
          if ($installers.Count -eq 0) { throw 'Installer output is missing' }
          python scripts/build_manifest.py @installers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: veya-desktop-windows-unsigned-${{ github.sha }}
          path: |
            apps/desktop/dist/
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            artifacts/build-manifest.json
            artifacts/SHA256SUMS.txt
            artifacts/supply-chain/
          if-no-files-found: error
          retention-days: 14
      - name: Record release boundary
        shell: pwsh
        run: '"Unsigned prototype installer. No GitHub Release was published and no update channel was changed." >> $env:GITHUB_STEP_SUMMARY'
  verify-package:
    name: Verify downloaded installer and frontend payload
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: veya-desktop-windows-unsigned-${{ github.sha }}
          path: downloaded-package
      - name: Check every downloaded checksum and source identity
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/verify_manifest.py --root downloaded-package --commit "$EXPECTED_COMMIT" --native
