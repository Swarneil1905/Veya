name: Rendered regression and diagnostic export
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Rendered regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          cache: false
      - run: python -m pip install uv==0.11.23
      - run: uv sync --project services/runtime --locked
      - run: python scripts/build_platform.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install browser on Linux
        if: runner.os == 'Linux'
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Live stack, screenshot contracts, accessibility and mutation control
        run: node scripts/test-operations-browser.mjs
      - name: Scan generated diagnostic output
        run: python scripts/scan_generated_artifacts.py artifacts/operations20/ui/diagnostics.json
      - name: Retain baseline, actual screenshots and structured diff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rendered-regression-${{ matrix.os }}
          path: |
            artifacts/operations20/ui/*.png
            artifacts/operations20/ui/*.json
            artifacts/operations20/ui/*.txt
          if-no-files-found: error
          retention-days: 14
