name: Sign reviewed update metadata
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed commit to sign metadata from
        required: true
      manifest_path:
        description: Repository-relative reviewed update manifest
        required: true
permissions:
  contents: read
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind request to the reviewed main commit and bounded metadata file
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          source = os.environ['SOURCE_COMMIT']
          if not re.fullmatch('[0-9a-f]{40}', source) or source != os.environ['GITHUB_SHA']:
              raise SystemExit('Signing must use the exact reviewed main commit')
          path = pathlib.Path(os.environ['MANIFEST_PATH'])
          root = pathlib.Path.cwd().resolve()
          if path.is_absolute() or '..' in path.parts or path.is_symlink():
              raise SystemExit('Invalid manifest path')
          if not path.resolve().is_relative_to(root) or path.stat().st_size > 16384:
              raise SystemExit('Manifest is outside the checkout or oversized')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Require configured independent environment approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = ('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
                 + '/environments/release-signing')
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          with urllib.request.urlopen(request, timeout=10) as response:
              environment = json.load(response)
          rules = environment.get('protection_rules', [])
          if not any(rule.get('type') == 'required_reviewers' and rule.get('reviewers')
                     and rule.get('prevent_self_review') is True for rule in rules):
              raise SystemExit('Configure independent reviewers on release-signing first')
          PY
      - run: python -m pip install uv==0.11.23
      - run: uv sync --project services/runtime --locked
      - name: Create detached signature
        env:
          VEYA_RELEASE_AUTHORIZED: 'true'
          VEYA_UPDATE_SIGNING_KEY: ${{ secrets.VEYA_UPDATE_SIGNING_KEY }}
          VEYA_UPDATE_PUBLIC_KEY: ${{ vars.VEYA_UPDATE_PUBLIC_KEY }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: >-
          uv run --project services/runtime --locked python -m scripts.sign_update
          --manifest "$MANIFEST_PATH" --output signed-update.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: detached-update-metadata-${{ github.sha }}
          path: signed-update.json
          if-no-files-found: error
      - run: echo 'Detached metadata signature only; no Authenticode, release publication or update-channel change.' >> "$GITHUB_STEP_SUMMARY"
