name: Operational recording and alert rules
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify Prometheus expressions and failure/missing telemetry scenarios
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/infra/observability:/work:ro" -w /work/rules prom/prometheus:v3.7.0 test rules test.yml
