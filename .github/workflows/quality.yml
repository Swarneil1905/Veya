name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '31 7 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    uses: ./.github/workflows/runtime-tests.yml
  platform:
    uses: ./.github/workflows/platform-tests.yml
  browser:
    uses: ./.github/workflows/workspace-browser.yml
  workflows:
    uses: ./.github/workflows/workflow-checks.yml
  frontend:
    name: Frontend and fixture contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Verify pinned engineering skills
        run: python scripts/verify-skills.py
      - name: Validate delivery ledger
        run: python scripts/project.py validate
      - name: Verify delivery tracker controls
        run: python -m unittest discover -s tests -v
      - name: Deterministic fixture contracts
        run: python -m unittest discover -s packages/fixtures/tests -v
      - name: Module boundaries
        run: python scripts/check_boundaries.py
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: python scripts/check_toolchains.py --bootstrap
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
      - run: pnpm build
      - run: node scripts/package-preview.mjs
      - run: node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-preview-${{ matrix.os }}
          path: |
            preview/
            artifacts/
          if-no-files-found: error
          retention-days: 14
  native-check:
    name: Windows native contract
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install the pinned runtime environment for native integration tests
        run: |
          python -m pip install uv==0.11.23
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --project services/runtime --locked
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          cache: false
      - run: python scripts/build_platform.py
      - run: pnpm build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- -D warnings
      - name: Test the native host with its locked Python runtime on PATH
        run: uv run --project services/runtime --locked cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
  required:
    name: Required quality gate
    timeout-minutes: 5
    if: always()
    needs: [frontend, native-check, runtime, platform, browser, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Reject any unsuccessful prerequisite
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native-check.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
        run: |
          for result in "$FRONTEND_RESULT" "$NATIVE_RESULT" "$RUNTIME_RESULT" "$PLATFORM_RESULT" "$BROWSER_RESULT" "$WORKFLOWS_RESULT"; do
            test "$result" = success || exit 1
          done
