name: Durable worker contracts
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  histories:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install pinned dependency manager
        run: python -m pip install uv==0.11.23
      - name: Install the locked worker environment
        run: uv sync --project services/worker --locked
      - name: Replay, review, timer, cancellation and recovery contracts
        run: >-
          uv run --project services/worker --locked python -m pytest
          services/worker/tests -q --junitxml=artifacts/durable-worker.xml
      - name: Verify final state after worker replacement and response loss
        run: uv run --project services/worker --locked python tests/reliability/scenario.py
      - name: Keep failure and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: durable-worker-${{ matrix.os }}
          path: |
            artifacts/durable-worker.xml
            artifacts/durable-recovery.json
          if-no-files-found: warn
          retention-days: 14
