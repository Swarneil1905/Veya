name: Team service integration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg18-bookworm@sha256:42e7f6b4e1eceb02ff14e3e6bc6108bbe259abbe83879dc1845d0da1ddeb555d
        env:
          POSTGRES_USER: fixture_admin
          POSTGRES_PASSWORD: fixture-ci-isolated-database
          POSTGRES_DB: veya_test_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture_admin -d veya_test_contracts"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.11.23
      - run: uv sync --project services/runtime --locked --extra team
      - name: Real repository, vector and isolation contracts
        env:
          VEYA_TEAM_TEST_DSN: postgresql://fixture_admin:fixture-ci-isolated-database@127.0.0.1:5432/veya_test_contracts
        run: >-
          uv run --project services/runtime --locked --extra team python -m pytest
          tests/team -q --junitxml=artifacts/team-results.xml
      - name: Build locked non-root service and worker images
        run: |
          docker build -f infra/containers/team.Dockerfile -t veya-team:test .
          docker build -f infra/containers/worker.Dockerfile -t veya-worker:test .
      - name: Missing configuration must prevent startup
        run: |
          if docker run --rm --read-only --cap-drop ALL --network none veya-team:test; then
            echo "Unconfigured team service unexpectedly started"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: team-service-contracts
          path: artifacts/team-results.xml
          if-no-files-found: warn
