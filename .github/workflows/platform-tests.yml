name: Go platform contracts
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    name: Go platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - run: python -m pip install uv==0.11.23
      - run: uv sync --project services/runtime --locked
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l services/platform)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            echo "::error::Go files above must be formatted with gofmt."
            exit 1
          fi
      - name: Vet, unit tests, private worker integration and native build
        run: uv run --project services/runtime --locked python scripts/build_platform.py --test
      - name: Record compiler and binary metadata
        shell: bash
        run: |
          go version
          go version -m apps/desktop/src-tauri/binaries/veya-platform*
