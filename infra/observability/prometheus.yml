global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/veya.yml
  - /etc/prometheus/alerts/veya.yml
scrape_configs:
  - job_name: veya-private-runtime
    metrics_path: /v1/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/runtime-token
    file_sd_configs:
      - files: ['/etc/prometheus/runtime-targets.json']
