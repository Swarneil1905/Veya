packages:
  - apps/desktop

# Angular's reviewed binary installer; optional native accelerators use prebuilt packages.
allowBuilds:
  esbuild@0.28.2: true
  "@parcel/watcher@2.6.0": false
  lmdb@3.5.6: false
  msgpackr-extract@3.0.4: false

# Compatible build-only security patches; keep the generated lockfile authoritative.
overrides:
  postcss: 8.5.23
  nanoid@3: 3.3.18
  source-map-js: 1.2.2
  vite: 8.3.3
